{% extends "base.html" %}

{% set active_page = "history" %}

{% block title %}历史记录 - AI Code Reviewer{% endblock %}

{% block content %}
<div class="row">
    <div class="col-12">
        <!-- Page Header -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1 class="h3 mb-1">历史记录</h1>
                <p class="text-muted mb-0">查看所有 PR 分析记录</p>
            </div>
            <div class="d-flex align-items-center gap-2">
                <span class="badge bg-secondary" id="totalCount">0 条记录</span>
            </div>
        </div>

        <!-- History Table Card -->
        <div class="card border-0 shadow-sm">
            <div class="card-body p-0">
                <!-- Empty State -->
                <div id="emptyState" class="empty-state" style="display: none;">
                    <i class="bi bi-inbox"></i>
                    <h5 class="mt-3">暂无分析记录</h5>
                    <p class="text-muted">开始你的第一次 PR 分析吧</p>
                    <a href="/" class="btn btn-primary mt-2">
                        <i class="bi bi-search me-1"></i>开始分析
                    </a>
                </div>

                <!-- History Table -->
                <div id="historyTable" style="display: none;">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead>
                                <tr>
                                    <th>仓库</th>
                                    <th>PR</th>
                                    <th>状态</th>
                                    <th>风险</th>
                                    <th>建议</th>
                                    <th>费用</th>
                                    <th>时间</th>
                                    <th class="text-end">操作</th>
                                </tr>
                            </thead>
                            <tbody id="historyList">
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <!-- Pagination -->
        <nav id="paginationNav" class="mt-4" style="display: none;">
            <ul class="pagination justify-content-center" id="paginationList">
            </ul>
        </nav>
    </div>
</div>

<!-- Delete Confirmation Modal -->
<div class="modal fade" id="deleteModal" tabindex="-1" aria-labelledby="deleteModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="deleteModalLabel">确认删除</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <p>确定要删除这条分析记录吗？此操作不可撤销。</p>
                <p class="text-muted small mb-0" id="deleteTarget"></p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-danger" id="confirmDeleteBtn">
                    <i class="bi bi-trash me-1"></i>删除
                </button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
    // History page state
    let currentPage = 1;
    const pageSize = 20;
    let deleteTargetId = null;
    let deleteModal = null;

    /**
     * Initialize page
     */
    document.addEventListener('DOMContentLoaded', function() {
        // Initialize delete modal
        deleteModal = new bootstrap.Modal(document.getElementById('deleteModal'));

        // Confirm delete button handler
        document.getElementById('confirmDeleteBtn').addEventListener('click', confirmDelete);

        // Load history
        loadHistory();
    });

    /**
     * Load history records
     */
    async function loadHistory(page = 1) {
        try {
            const response = await AIReviewer.apiRequest(`/api/analyses?page=${page}&page_size=${pageSize}`);
            const items = response.items || [];
            const total = response.total || 0;

            // Update total count
            document.getElementById('totalCount').textContent = `${total} 条记录`;

            // Toggle empty state / table
            const emptyState = document.getElementById('emptyState');
            const historyTable = document.getElementById('historyTable');

            if (total === 0) {
                emptyState.style.display = 'block';
                historyTable.style.display = 'none';
                document.getElementById('paginationNav').style.display = 'none';
            } else {
                emptyState.style.display = 'none';
                historyTable.style.display = 'block';
                renderHistoryTable(items);
                renderPagination(total, page);
            }
        } catch (error) {
            console.error('Failed to load history:', error);
            AIReviewer.showStatus('danger', '加载失败', error.message);
        }
    }

    /**
     * Render history table rows
     */
    function renderHistoryTable(items) {
        const tbody = document.getElementById('historyList');

        tbody.innerHTML = items.map(item => `
            <tr>
                <td>
                    <a href="${item.pr_url}" target="_blank" class="fw-medium">
                        ${escapeHtml(item.repository)}
                    </a>
                </td>
                <td>
                    <a href="${item.pr_url}" target="_blank" class="text-muted">
                        #${item.pr_number}
                    </a>
                </td>
                <td>${AIReviewer.getStatusBadge(item.status)}</td>
                <td>
                    <span class="${item.risk_count > 0 ? 'text-danger fw-medium' : 'text-muted'}">
                        ${item.risk_count}
                    </span>
                </td>
                <td>
                    <span class="${item.suggestion_count > 0 ? 'text-info fw-medium' : 'text-muted'}">
                        ${item.suggestion_count}
                    </span>
                </td>
                <td class="text-muted">${AIReviewer.formatCost(item.cost_usd)}</td>
                <td class="text-muted">${AIReviewer.formatDate(item.created_at)}</td>
                <td class="text-end">
                    <div class="btn-group btn-group-sm">
                        <a href="/analysis/${item.id}" class="btn btn-outline-secondary" title="查看详情">
                            <i class="bi bi-eye"></i>
                        </a>
                        <button class="btn btn-outline-danger" title="删除" onclick="showDeleteModal('${item.id}', '${escapeHtml(item.repository)} #${item.pr_number}')">
                            <i class="bi bi-trash"></i>
                        </button>
                    </div>
                </td>
            </tr>
        `).join('');
    }

    /**
     * Render pagination
     */
    function renderPagination(total, currentPageNum) {
        const totalPages = Math.ceil(total / pageSize);
        const paginationNav = document.getElementById('paginationNav');
        const paginationList = document.getElementById('paginationList');

        if (totalPages <= 1) {
            paginationNav.style.display = 'none';
            return;
        }

        paginationNav.style.display = 'block';

        let html = '';

        // Previous button
        html += `
            <li class="page-item ${currentPageNum === 1 ? 'disabled' : ''}">
                <a class="page-link" href="#" onclick="loadHistory(${currentPageNum - 1}); return false;">
                    <i class="bi bi-chevron-left"></i>
                </a>
            </li>
        `;

        // Page numbers
        const maxVisiblePages = 5;
        let startPage = Math.max(1, currentPageNum - Math.floor(maxVisiblePages / 2));
        let endPage = Math.min(totalPages, startPage + maxVisiblePages - 1);

        if (endPage - startPage + 1 < maxVisiblePages) {
            startPage = Math.max(1, endPage - maxVisiblePages + 1);
        }

        if (startPage > 1) {
            html += `<li class="page-item"><a class="page-link" href="#" onclick="loadHistory(1); return false;">1</a></li>`;
            if (startPage > 2) {
                html += `<li class="page-item disabled"><span class="page-link">...</span></li>`;
            }
        }

        for (let i = startPage; i <= endPage; i++) {
            html += `
                <li class="page-item ${i === currentPageNum ? 'active' : ''}">
                    <a class="page-link" href="#" onclick="loadHistory(${i}); return false;">${i}</a>
                </li>
            `;
        }

        if (endPage < totalPages) {
            if (endPage < totalPages - 1) {
                html += `<li class="page-item disabled"><span class="page-link">...</span></li>`;
            }
            html += `<li class="page-item"><a class="page-link" href="#" onclick="loadHistory(${totalPages}); return false;">${totalPages}</a></li>`;
        }

        // Next button
        html += `
            <li class="page-item ${currentPageNum === totalPages ? 'disabled' : ''}">
                <a class="page-link" href="#" onclick="loadHistory(${currentPageNum + 1}); return false;">
                    <i class="bi bi-chevron-right"></i>
                </a>
            </li>
        `;

        paginationList.innerHTML = html;
    }

    /**
     * Show delete confirmation modal
     */
    function showDeleteModal(id, label) {
        deleteTargetId = id;
        document.getElementById('deleteTarget').textContent = label;
        deleteModal.show();
    }

    /**
     * Confirm and execute delete
     */
    async function confirmDelete() {
        if (!deleteTargetId) return;

        const btn = document.getElementById('confirmDeleteBtn');
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>删除中...';

        try {
            await AIReviewer.apiRequest(`/api/analyses/${deleteTargetId}`, {
                method: 'DELETE',
            });

            deleteModal.hide();
            AIReviewer.showStatus('success', '删除成功', '记录已删除');

            // Reload current page
            loadHistory(currentPage);
        } catch (error) {
            AIReviewer.showStatus('danger', '删除失败', error.message);
        } finally {
            btn.disabled = false;
            btn.innerHTML = '<i class="bi bi-trash me-1"></i>删除';
            deleteTargetId = null;
        }
    }

    /**
     * Escape HTML to prevent XSS
     */
    function escapeHtml(str) {
        if (!str) return '';
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }
</script>
{% endblock %}
