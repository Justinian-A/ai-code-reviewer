version: '3.8'

services:
  backend:
    build: ./backend
    container_name: ai-review-backend
    environment:
      - MIMO_API_KEY=${MIMO_API_KEY}
      - MIMO_BASE_URL=${MIMO_BASE_URL}
      - MIMO_MODEL=${MIMO_MODEL}
      - SECRET_KEY=${SECRET_KEY}
    volumes:
      - db_data:/app/data
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: ai-review-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db_data:
